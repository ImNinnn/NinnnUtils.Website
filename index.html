<style>
  :root{
    --bg-black:#000000;
    --bg-warm:#735050;
    --panel:#1c1414;
    --panel-2:#241a1a;
    --frame:#7a5b5b;
    --frame-dim:#4a3838;
    --ink:#f2e9e4;
    --ink-dim:#c9b8b2;
    --ink-faint:#8f7a76;
    --ember:#c1665a;
    --ember-bright:#e08a72;
    --gold:#d1a45c;
    --eye:#f5f0ea;
    --line: rgba(242,233,228,0.12);
    --radius: 3px;
    --font-pixel:'Silkscreen', monospace;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--ink);
    background:#0a0606;
    min-height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    padding:56px 20px 60px;
  }

  /* background image lives at ninnn_bg.png, next to this file */
  #bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-2;
    background-image:url('ninnn_bg.png');
    background-size:cover;
    background-position:center;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  #bg-overlay{
    position:fixed;
    inset:0;
    z-index:-1;
    background:linear-gradient(180deg, rgba(10,6,6,0.55) 0%, rgba(10,6,6,0.75) 55%, rgba(10,6,6,0.92) 100%);
  }

  a{color:inherit;}
  ::selection{background:var(--ember); color:#0a0606;}

  .card{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .avatar{
    width:96px;
    height:96px;
    border:2px solid var(--frame);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:20px;
    position:relative;
  }
  .avatar::after{
    content:"";
    position:absolute;
    inset:-10px;
    border:2px dashed var(--frame-dim);
    border-radius:8px;
    pointer-events:none;
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    image-rendering:pixelated;
    display:block;
  }

  h1{
    font-family:var(--font-pixel);
    font-size:26px;
    margin:0 0 8px;
    color:var(--ink);
    text-shadow:2px 2px 0 rgba(0,0,0,0.5);
  }

  .tagline{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--ink-faint);
    margin:0 0 32px;
    letter-spacing:0.3px;
  }

  /* featured bot link */
  .featured{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:16px 20px;
    background:linear-gradient(135deg, var(--bg-warm), #2b1c1c);
    border:1px solid var(--frame);
    border-radius:var(--radius);
    text-decoration:none;
    color:var(--ink);
    margin-bottom:28px;
    transition:transform .12s ease;
  }
  .featured:hover{transform:translateY(-2px);}
  .featured .icon{width:22px; height:22px; image-rendering:pixelated; flex-shrink:0;}
  .featured .label{display:flex; flex-direction:column; align-items:flex-start;}
  .featured .label b{font-size:14.5px;}
  .featured .label span{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-dim);
  }

  .section-label{
    width:100%;
    text-align:left;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 12px;
  }

  .grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:30px;
  }

  .tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:16px 8px;
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--radius);
    text-decoration:none;
    color:var(--ink-dim);
    transition:transform .12s ease, border-color .15s ease, color .15s ease;
  }
  .tile:hover{
    transform:translateY(-2px);
    border-color:var(--frame);
    color:var(--ink);
  }
  .tile .mono{
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-pixel);
    font-size:11px;
    background:#140f0f;
    border:1px solid var(--line);
  }
  .tile span.name{
    font-size:11.5px;
    font-weight:700;
    line-height:1.3;
  }

  .discord-wrap{
    width:100%;
  }
  .discord-frame{
    width:100%;
    display:flex;
    justify-content:center;
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .discord-frame iframe{
    border-radius:2px;
    max-width:100%;
  }

  footer{
    margin-top:36px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-faint);
  }
  .heart{
    color:var(--ember-bright);
    display:inline-block;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

  @media (max-width: 480px){
    .grid{grid-template-columns:repeat(2, 1fr);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
